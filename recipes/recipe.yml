---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Образ публикуется в ghcr.io/<user>/<name>, т.е. ghcr.io/themakarik/kkrit-os
name: kkrit-os
description: KKRIT OS 2026 — сборка Fedora Kinoite для ККРИТ

# База: Fedora Kinoite (KDE Plasma)
base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

# Модули выполняются по порядку
modules:
  # Брендинг: имя системы в /etc/os-release
  - type: os-release
    properties:
      NAME: KKRIT OS
      PRETTY_NAME: KKRIT OS 2026
      ID_LIKE: fedora

  # Далее сюда добавим:
  # - type: files          # свои файлы (обои, конфиги) из files/system/
  # - type: dnf            # пакеты из репозиториев Fedora/COPR
  # - type: default-flatpaks  # приложения из Flathub
  # - type: signing        # подпись образа cosign
