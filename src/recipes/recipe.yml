---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: template
# description will be included in the image's metadata
description: This is my personal OS image.

base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest 


modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      nonfree: rpmfusion
      copr:

        - ublue-os/packages
        - atim/starship
      # AliveColors (AKVIS): вендорский репозиторий и ключ подписи
      files:
        - https://akvis.com/akvis.ru.repo
      keys:
        - https://akvis.com/akvis.asc
    install:
      packages:
        - micro
        - starship
        - fastfetch
        # Графика: аналоги Photoshop / Illustrator
        - gimp
        - krita
        - inkscape
        # AliveColors (аналог Photoshop / Illustrator, репозиторий AKVIS)
        - alivecolors
        # Видео и анимация: аналоги Premiere Pro / After Effects / Animate
        - kdenlive
        - opentoonz
        # Звук: аналог Audition
        - audacity
        # Офис: аналоги Word / Excel / PowerPoint
        - libreoffice-writer
        - libreoffice-calc
        - libreoffice-impress
        - libreoffice-draw
        - libreoffice-langpack-ru
        - distrobox
    remove:
      packages:
        - firefox
        - firefox-langpacks 

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          # Аналог After Effects (нет в репозиториях Fedora)
          - fr.natron.Natron
          # Аналоги Word / Excel / PowerPoint
          - org.onlyoffice.desktopeditors
          # Аналог Google Chrome
          - ru.yandex.Browser
      - scope: user # Also add Flathub user repo, but no user packages

  # Брендинг системы: имя и логотип (иконка kkrit-logo из hicolor)
  - type: os-release
    properties:
      NAME: KKRIT OS
      PRETTY_NAME: KKRIT OS 2026
      ID_LIKE: fedora
      LOGO: kkrit-logo

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
